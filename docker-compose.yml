services:
  mongo:
    image: mongo:latest
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - bookstore-network

  # Microservice Inventory/Books ---
  ms-books:
    build:
      context: ./loopback-bookstore_2
      dockerfile: Dockerfile
    container_name: ms-books
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
    depends_on:
      - mongo
    ports:
      - "3000:3000"
    networks:
      - bookstore-network

  # Microservice Order
  ms-orders:
    build:
      context: ./loopback-order
      dockerfile: Dockerfile
    container_name: ms-orders
    restart: unless-stopped
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
    depends_on:
      - mongo
    ports:
      - "3001:3001"
    networks:
      - bookstore-network

  # Microservice Payment
  ms-payments:
    build:
      context: ./loopback-payment
      dockerfile: Dockerfile
    container_name: ms-payments
    restart: unless-stopped
    environment:
      - PORT=3002
      - HOST=0.0.0.0
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
    depends_on:
      - mongo
    ports:
      - "3002:3002"
    networks:
      - bookstore-network

  # API Gateway : point d'entrée unique pour le frontend
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      - PORT=9001
      - BOOKS_SERVICE_URL=http://ms-books:3000
      - ORDERS_SERVICE_URL=http://ms-orders:3001
      - PAYMENTS_SERVICE_URL=http://ms-payments:3002
    depends_on:
      - ms-books
      - ms-orders
      - ms-payments
    ports:
      - "9001:9001"
    networks:
      - bookstore-network

  # Frontend Express
  bookstore-web-app:
    build:
      context: ./bookstore-web-app
      dockerfile: Dockerfile
    container_name: bookstore-web-app
    restart: unless-stopped
    environment:
      - PORT=3000
      - GATEWAY_URL=http://api-gateway:9001
    depends_on:
      - api-gateway
    ports:
      - "8082:3000"
    networks:
      - bookstore-network

networks:
  bookstore-network:
    driver: bridge

volumes:
  mongo-data:
